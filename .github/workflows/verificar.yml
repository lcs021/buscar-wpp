name: Verificar busca e painel
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: for arquivo in web/*.js extensao/*.js; do node --check "$arquivo" || exit 1; done
      - run: python3 tools/empacotar-extensao.py
