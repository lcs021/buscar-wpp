<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Carregando proposta…</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4f2;color:#555;font:15px/1.5 system-ui,sans-serif;text-align:center;padding:20px}
    .giro{width:28px;height:28px;border:3px solid #ddd;border-top-color:#333;border-radius:50%;animation:g .8s linear infinite;margin:0 auto 12px}
    @keyframes g{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="msg"><div class="giro"></div>Carregando proposta…</div>
  <script type="module">
    import { rpcPublica } from "./sb.js";
    import { renderProposta } from "./proposta-render.js";
    const qs = new URLSearchParams(location.search);
    const slug = qs.get("s") || "";
    const falha = (t) => { document.title = "Proposta indisponível"; document.getElementById("msg").textContent = t; };
    try {
      const p = await rpcPublica("proposta_publica", { p_slug: slug, p_contar: !qs.has("p") });
      if (!p) falha("Esta proposta não está disponível.");
      else {
        const base = location.href.replace(/proposta\.html.*$/, "");
        const html = renderProposta(p, { linkDemo: `${base}demo.html?s=${encodeURIComponent(slug)}`, linkProposta: `${base}proposta.html?s=${encodeURIComponent(slug)}` });
        document.open(); document.write(html); document.close();
      }
    } catch (e) {
      falha("Não foi possível carregar a proposta agora. Tente de novo em instantes.");
    }
  </script>
</body>
</html>
